name: android

on:
  push:
    paths: ['android/**', 'design/**', 'docs/brand/icon.svg', 'scripts/generate-themes.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'design/**', 'docs/brand/icon.svg', 'scripts/generate-themes.mjs', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-disabled: true
      - run: node scripts/generate-themes.mjs --check
      - run: ./gradlew securityInventory testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --warning-mode=fail
        working-directory: android
      - run: python3 scripts/audit-android-dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutter-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
